<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa dos Mistérios</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/como-jogar.css">
  <link rel="stylesheet" href="assets/css/preferencias.css">
</head>
<body>

  <section class="tela tela--relativa" id="tela-principal">

    <!-- Acesso às configurações de acessibilidade -->
    <button class="btn-config" id="btn-config"
            type="button"
            aria-label="Abrir configurações de acessibilidade"
            aria-haspopup="dialog"
            aria-controls="modal-config"
            aria-expanded="false">
      <img src="assets/img/config.png" alt="" aria-hidden="true" style="width:20px;height:20px;">
    </button>

    <!-- Cabeçalho -->
    <section class="inicio-header">
      <h1 class="inicio-header__titulo">Casa dos Mistérios</h1>
      <p class="inicio-header__subtitulo">🔍 Aventura de lógica</p>
    </section>

    <!-- Mascote Logi de boas-vindas -->
    <section class="balao inicio-logi" aria-label="Mensagem do Logi">
      <img src="assets/img/logi_feliz.png" alt="" class="logi-mascote">
      <p class="balao__texto" id="logi-boas-vindas">
        Olá! Eu sou o <strong>Logi</strong>, seu guia investigador! Prontos para resolver os mistérios da casa?
      </p>
    </section>


    <!-- Menu -->
    <div class="menu-botoes">
      <button class="btn--menu-principal btn--menu-laranja"
              onclick="window.location.href='assets/pages/MapaCasa.html'">
        <span>▶</span>
        <strong>Jogar</strong>
      </button>
      <button class="btn--menu-principal btn--menu-ambar" id="btn-como-jogar">
        <span>📖</span>
        <strong>Como jogar</strong>
      </button>
      <button class="btn--menu-principal btn--menu-outline"
              onclick="window.location.href='assets/pages/TelaPontuacao.html'">
        <span>🏆</span>
        <strong>Pontuações</strong>
      </button>
      <button class="btn--menu-principal btn--menu-outline" id="btn-resetar">
        <span>↻</span>
        <strong>Reiniciar progresso</strong>
      </button>
    </div>

    <!-- Prévia dos cômodos -->
    <section class="inicio-comodos" aria-label="Cômodos do jogo">
      <p class="inicio-comodos__titulo">Cômodos da Casa</p>
      <div class="inicio-comodos__lista">
        <article class="inicio-comodo">
          <img src="assets/img/icone-sala.png" alt="" class="inicio-comodo__icone-img">
          <p class="inicio-comodo__label" id="lbl-sala">Sala</p>
        </article>
        <article class="inicio-comodo">
          <img src="assets/img/icone-quarto.png" alt="" class="inicio-comodo__icone-img">
          <p class="inicio-comodo__label inicio-comodo__label--cinza" id="lbl-quarto">Quarto</p>
        </article>
        <article class="inicio-comodo">
          <img src="assets/img/icone-cozinha.png" alt="" class="inicio-comodo__icone-img">
          <p class="inicio-comodo__label inicio-comodo__label--cinza" id="lbl-cozinha">Cozinha</p>
        </article>
        <article class="inicio-comodo">
          <img src="assets/img/icone-despensa.png" alt="" class="inicio-comodo__icone-img">
          <p class="inicio-comodo__label inicio-comodo__label--cinza" id="lbl-despensa">Despensa</p>
        </article>
      </div>
      <p class="inicio-rodape">2º e 3º ano do Ensino Fundamental</p>
    </section>

  </section><!-- /tela-principal -->

  <!-- ===== Modal Como Jogar ===== -->
  <div class="modal-overlay" id="modal-como-jogar" role="dialog" aria-modal="true"
       aria-labelledby="cj-titulo" style="display:none;">
    <section class="modal cj-modal">
      <button class="modal-fechar" id="btn-fechar-cj-x" type="button" aria-label="Fechar como jogar">✕</button>
      <h2 class="modal-titulo cj-titulo" id="cj-titulo">Como jogar</h2>

      <div id="cj-raiz"></div>

      <button class="btn btn--laranja" style="margin-top:.9rem;width:100%;"
              id="btn-fechar-cj" aria-label="Fechar instruções">
        Entendi!
      </button>
    </section>
  </div>

  <script src="assets/js/plataforma.js"></script>
  <script src="assets/js/gameState.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/tutorial.js"></script>
  <script src="assets/js/tutoriais/sala-f1.js"></script>
  <script src="assets/js/tutoriais/sala-f3.js"></script>
  <script src="assets/js/tutoriais/quarto-f1.js"></script>
  <script src="assets/js/tutoriais/cozinha-f1.js"></script>
  <script src="assets/js/tutoriais/despensa-f1.js"></script>
  <script src="assets/js/tutoriais/despensa-f2.js"></script>
  <script src="assets/js/tutoriais/despensa-f3.js"></script>
  <script src="assets/js/como-jogar.js"></script>
  <script src="assets/js/preferencias.js"></script>
  <script>
  /* ===== index.html — menu principal ===== */

  /* Atualiza labels dos cômodos com status de progresso */
  function atualizarStatus() {
    const state = gameState.get();
    const ids   = ['sala', 'quarto', 'cozinha', 'despensa'];
    ids.forEach(id => {
      const el = document.getElementById('lbl-' + id);
      if (!el) return;
      if (state.completed[id]) {
        el.classList.remove('inicio-comodo__label--cinza');
        el.textContent = el.textContent.replace(' ✓', '') + ' ✓';
      }
    });
  }

  /* ===== Configurações ===== */
  let modalAberto = null;
  let acionadorModal = null;

  function elementosFocaveis(modal) {
    return [...modal.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )].filter(el => !el.hidden && el.offsetParent !== null);
  }

  function abrirModal(id, acionador) {
    const modal = document.getElementById(id);
    modalAberto = modal;
    acionadorModal = acionador || document.activeElement;
    modal.style.display = 'flex';
    if (acionadorModal?.hasAttribute('aria-expanded')) {
      acionadorModal.setAttribute('aria-expanded', 'true');
    }
    requestAnimationFrame(() => elementosFocaveis(modal)[0]?.focus());
  }

  function fecharModal(id) {
    const modal = document.getElementById(id);
    if (modal.style.display === 'none') return;
    modal.style.display = 'none';
    const acionador = acionadorModal;
    if (acionador?.hasAttribute('aria-expanded')) {
      acionador.setAttribute('aria-expanded', 'false');
    }
    modalAberto = null;
    acionadorModal = null;
    acionador?.focus();
  }

  /* Preferências: tela própria (assets/js/preferencias.js) */
  Preferencias.ligar(document.getElementById('btn-config'));
  document.getElementById('btn-como-jogar').addEventListener('click', e => {
    abrirModal('modal-como-jogar', e.currentTarget);
    ComoJogar.reiniciar();
  });
  document.getElementById('btn-fechar-cj-x').addEventListener('click', () => {
    fecharModal('modal-como-jogar');
  });
  document.getElementById('btn-fechar-cj').addEventListener('click', () => {
    fecharModal('modal-como-jogar');
  });

  // Fechar ao clicar fora
  ['modal-como-jogar'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target === e.currentTarget) fecharModal(id);
    });
  });

  // Mantém a navegação no modal aberto e permite fechá-lo com Esc.
  document.addEventListener('keydown', e => {
    if (!modalAberto) return;

    if (e.key === 'Escape') {
      e.preventDefault();
      fecharModal(modalAberto.id);
      return;
    }

    if (e.key === 'Tab') {
      const focaveis = elementosFocaveis(modalAberto);
      if (!focaveis.length) {
        e.preventDefault();
        return;
      }
      const primeiro = focaveis[0];
      const ultimo = focaveis[focaveis.length - 1];
      if (e.shiftKey && document.activeElement === primeiro) {
        e.preventDefault();
        ultimo.focus();
      } else if (!e.shiftKey && document.activeElement === ultimo) {
        e.preventDefault();
        primeiro.focus();
      }
    }
  });

  /* ---- Resetar progresso ---- */
  document.getElementById('btn-resetar').addEventListener('click', () => {
    if (confirm('Apagar todo o progresso e recomeçar?')) {
      gameState.reset();
      localStorage.removeItem('sala_fase');
      localStorage.removeItem('despensa_nivel');
      atualizarStatus();
    }
  });

  /* ===== Como jogar: guia montado por assets/js/como-jogar.js ===== */
  ComoJogar.montarIndice(document.getElementById('cj-raiz'));

  atualizarStatus();

  /* Preferências mudaram (nome, reinício do progresso): atualiza a tela inicial */
  function saudacao() {
    const nome = String(gameState.getSettings().nome || '').trim();
    const el = document.getElementById('logi-boas-vindas');
    el.innerHTML = (nome ? 'Olá, <strong>' + nome.replace(/[<>&"]/g, '') + '</strong>! ' : 'Olá! ') +
      'Eu sou o <strong>Logi</strong>, seu guia investigador! Prontos para resolver os mistérios da casa?';
  }
  document.addEventListener('preferencias:mudou', saudacao);
  document.addEventListener('progresso:mudou', () => location.reload());
  saudacao();
  </script>

</body>
</html>
