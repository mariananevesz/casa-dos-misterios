<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despensa — Estoque Inteligente</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/despensa.css">
  <link rel="stylesheet" href="../css/tutorial.css">
  <link rel="stylesheet" href="../css/como-jogar.css">
</head>
<body class="pagina-despensa">

  <section class="tela tela--marrom despensa-page" id="tela-principal">

    <!-- HUD -->
    <section class="hud despensa-hud">
      <button class="btn-voltar-mapa despensa-voltar"
              onclick="gameState.sairMiniGame('despensa','MapaCasa.html')"
              aria-label="Voltar ao mapa">← Mapa</button>

      <section class="hud__info despensa-hud__info">
        <img src="../img/icone-despensa.png" alt="" class="hud__icone-img despensa-hud__icone">
        <section>
          <p class="hud__titulo hud__titulo--marrom despensa-hud__titulo">Despensa<span class="despensa-hud__skill"> — Estoque Inteligente</span></p>
          <p class="hud__subtitulo hud__subtitulo--marrom despensa-hud__subtitulo" id="hud-subtitulo">Mini-jogo 4</p>
        </section>
      </section>

      <span class="badge badge--marrom despensa-badge" id="badge-pts" aria-live="polite">0 pts</span>

      <button class="btn-ajuda" id="btn-ajuda" type="button" aria-haspopup="dialog" aria-controls="modal-ajuda" aria-expanded="false" aria-label="Como jogar e objetivo">?</button>
    </section>

    <!-- Mascote Logi -->
    <section class="balao balao--marrom despensa-logi" aria-label="Instruções do Logi">
      <img src="../img/logi_feliz.png" alt="" class="logi-mascote despensa-logi__img">
      <div class="balao__corpo despensa-logi__corpo">
        <p class="balao__texto balao__texto--marrom despensa-logi__texto" id="logi-boas-vindas"></p>
        <p class="balao__instrucao despensa-logi__instrucao" id="logi-instrucao"></p>
        <p class="balao__legenda-cor despensa-logi__legenda" id="logi-legenda-cor" style="display:none;">
        </p>
      </div>
    </section>

    <section class="despensa-layout">

      <section class="despensa-main" aria-label="Área principal da despensa">
        <!-- Abas de nível -->
        <section class="niveis despensa-niveis" id="niveis-tabs" aria-label="Níveis de dificuldade"></section>

        <section class="despensa-work-grid" id="despensa-work-grid">
          <!-- Painel: itens para selecionar ou arrastar -->
          <section class="painel despensa-card despensa-card--itens" id="painel-itens">
            <p class="painel__label despensa-card__titulo" id="painel-itens-label">Itens para organizar</p>
            <section class="itens-grid despensa-itens-grid" id="itens-grid" role="listbox" aria-label="Itens disponíveis"></section>

            <button type="button" class="btn-dica despensa-btn-dica" id="btn-dica" aria-label="Dica do Logi">
              <svg class="btn-dica__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 21h6M10 17.5h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2v.6h5v-.6c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="#FFF3B0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Dica</span>
            </button>
          </section>

          <!-- Painel: prateleira (oculto no nível Fácil) -->
          <section class="painel despensa-card despensa-card--prateleira" id="painel-prateleira">
            <p class="painel__label despensa-card__titulo" id="prateleira-label">Prateleira</p>
            <section class="prateleira despensa-prateleira" id="prateleira" role="group" aria-label="Prateleira" aria-live="polite"></section>
            <section class="prateleira__legenda despensa-prateleira__legenda">
              <span class="prateleira__leg-txt" id="leg-esq">menor</span>
              <span style="flex:1;"></span>
              <span class="prateleira__leg-txt" id="leg-dir">maior</span>
            </section>
          </section>
        </section>

        <!-- Feedback granular -->
        <section id="feedback-area" class="despensa-feedback" style="display:none;" aria-live="polite">
          <section class="dica" id="feedback-dica">
            <span class="dica__emoji" id="feedback-emoji" aria-hidden="true">💡</span>
            <p class="dica__texto" id="feedback-texto"></p>
          </section>
        </section>

        <!-- Botões -->
        <section class="btn-grupo despensa-actions">
          <button class="btn btn--marrom btn--confirmar despensa-btn" id="btn-confirmar" aria-label="Confirmar organização">
            ✓ Confirmar!
          </button>
          <button class="btn btn--outline despensa-btn despensa-btn--limpar" id="btn-limpar" aria-label="Limpar seleção">Limpar</button>
        </section>
      </section>

    </section>

  </section>

  <!-- Modal de Como jogar / Objetivo -->
  <div class="modal-overlay" id="modal-ajuda" role="dialog" aria-modal="true" aria-labelledby="modal-ajuda-titulo" style="display:none;">
    <section class="modal modal-ajuda cj-modal">
      <button class="modal-fechar" id="modal-ajuda-fechar" type="button" aria-label="Fechar">✕</button>
      <h2 class="modal-titulo cj-titulo" id="modal-ajuda-titulo">Como jogar</h2>
      <div id="cj-raiz"></div>
    </section>
  </div>

  <!-- Modal de conclusão -->
  <div class="modal-overlay" id="modal-conclusao" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" aria-describedby="modal-sub modal-pts" style="display:none;">
    <section class="modal">
      <img src="../img/estrela.png" alt="" class="modal-trofeu">
      <h2 class="modal-titulo" id="modal-titulo">Despensa organizada!</h2>
      <p class="modal-sub" id="modal-sub"></p>
      <section class="modal-estrelas" id="modal-estrelas" aria-label="Estrelas conquistadas"></section>
      <p class="modal-pts" id="modal-pts"></p>
      <section class="btn-grupo" style="margin-top:1rem;">
        <button class="btn btn--laranja" id="btn-proximo-nivel" style="display:none;">Próximo nível</button>
        <button class="btn btn--outline" onclick="gameState.sairMiniGame('despensa','MapaCasa.html')">Voltar ao mapa</button>
      </section>
    </section>
  </div>

  <script src="../js/plataforma.js"></script>
  <script src="../js/gameState.js"></script>
  <script src="../js/audio.js"></script>
  <script src="../js/tutorial.js"></script>
  <script src="../js/tutoriais/despensa-f1.js"></script>
  <script src="../js/tutoriais/despensa-f2.js"></script>
  <script src="../js/tutoriais/despensa-f3.js"></script>
  <script src="../js/como-jogar.js"></script>
  <script>ComoJogar.montarComodo(document.getElementById('cj-raiz'), 'despensa');</script>
  <script>
  /* ===== DESPENSA — lógica do jogo ===== */

  /* -----------------------------------------------------------
     Dados inline — espelho exato de despensa.json.
     Usado como fallback quando fetch falha em file://.
     ATENÇÃO: manter sincronizado com assets/data/despensa.json.
  ----------------------------------------------------------- */
  const DESPENSA_INLINE = {
    "miniJogo": "Despensa — Estoque Inteligente",
    "habilidadeBNCC": "EF02CO01",
    "instrucaoInstrutor": "Oi! Minha despensa está uma bagunça!",
    "niveis": [
      {
        "nivel": "Fácil",
        "criterio": "selecao-cor",
        "instrucao": "Clique nas frutas VERMELHAS!",
        "dica": { "errado": "Esta fruta NÃO é vermelha. Toque de novo para tirar.", "certo": "Esta fruta é VERMELHA. Toque nela!" },
        "itens": [
          { "id": "maca",    "nome": "Maçã",    "cor": "vermelho", "img": "../img/maça.png"    },
          { "id": "morango", "nome": "Morango", "cor": "vermelho", "img": "../img/morango.png"                   },
          { "id": "banana",  "nome": "Banana",  "cor": "amarelo",  "img": "../img/banana.png"  },
          { "id": "uva",     "nome": "Uva",     "cor": "roxo",     "img": "../img/uva.png"     },
          { "id": "mirtilo", "nome": "Mirtilo", "cor": "azul",     "img": "../img/mirtilo.png" }
        ],
        "corretos": ["maca", "morango"]
      },
      {
        "nivel": "Médio",
        "criterio": "tamanho",
        "instrucao": "Clique ou arraste por TAMANHO: do menor para o maior.",
        "dica": { "errado": "Esta fruta está no lugar ERRADO. Toque para tirar.", "certo": "A próxima é a MENOR que sobrou." },
        "itens": [
          { "id": "uva",      "nome": "Uva",      "tamanho": 2, "img": "../img/uva.png"      },
          { "id": "melancia", "nome": "Melancia", "tamanho": 5, "img": "../img/melancia.png" },
          { "id": "maca",     "nome": "Maçã",     "tamanho": 3, "img": "../img/maça.png"     },
          { "id": "mirtilo",  "nome": "Mirtilo",  "tamanho": 1, "img": "../img/mirtilo.png"  },
          { "id": "banana",   "nome": "Banana",   "tamanho": 4, "img": "../img/banana.png"   }
        ],
        "ordemCorreta": ["mirtilo", "uva", "maca", "banana", "melancia"]
      },
      {
        "nivel": "Difícil",
        "criterio": "selecao-sementes",
        "instrucao": "Escolha apenas as frutas que têm SEMENTES por dentro.",
        "dica": { "errado": "Esta fruta NÃO tem sementes por dentro.", "certo": "Esta fruta tem SEMENTES por dentro." },
        "itens": [
          { "id": "melancia", "nome": "Melancia", "tipo": "sementes", "img": "../img/melancia.png" },
          { "id": "kiwi",     "nome": "Kiwi",     "tipo": "sementes", "img": "../img/kiwi.png"     },
          { "id": "uva",      "nome": "Uva",      "tipo": "sementes", "img": "../img/uva.png"      },
          { "id": "abacaxi",  "nome": "Abacaxi",  "tipo": "sem-semente-visivel", "img": "../img/abacaxi.png" },
          { "id": "morango",  "nome": "Morango",  "tipo": "aquenios", "img": "../img/morango.png" },
          { "id": "banana",   "nome": "Banana",   "tipo": "sem-semente", "img": "../img/banana.png" }
        ],
        "corretos": ["melancia", "kiwi", "uva"]
      }
    ]
  };

  /* Fallback de variações — usado apenas quando o fetch falha (file://) */
  const DESPENSA_VARIACOES_INLINE = { "variacoes": [ { "niveis": [
    {
      "itens": [
        { "id": "maca",    "nome": "Maçã",    "cor": "vermelho", "img": "../img/maça.png" },
        { "id": "morango", "nome": "Morango", "cor": "vermelho", "img": "../img/morango.png" },
        { "id": "banana",  "nome": "Banana",  "cor": "amarelo",  "img": "../img/banana.png" },
        { "id": "uva",     "nome": "Uva",     "cor": "roxo",     "img": "../img/uva.png" },
        { "id": "mirtilo", "nome": "Mirtilo", "cor": "azul",     "img": "../img/mirtilo.png" }
      ],
      "corretos": ["maca", "morango"]
    },
    {
      "itens": [
        { "id": "uva",      "nome": "Uva",      "tamanho": 2, "img": "../img/uva.png" },
        { "id": "melancia", "nome": "Melancia", "tamanho": 5, "img": "../img/melancia.png" },
        { "id": "maca",     "nome": "Maçã",     "tamanho": 3, "img": "../img/maça.png" },
        { "id": "mirtilo",  "nome": "Mirtilo",  "tamanho": 1, "img": "../img/mirtilo.png" },
        { "id": "banana",   "nome": "Banana",   "tamanho": 4, "img": "../img/banana.png" }
      ],
      "ordemCorreta": ["mirtilo", "uva", "maca", "banana", "melancia"]
    },
    {
      "itens": [
        { "id": "melancia", "nome": "Melancia", "tipo": "sementes", "img": "../img/melancia.png" },
        { "id": "kiwi",     "nome": "Kiwi",     "tipo": "sementes", "img": "../img/kiwi.png" },
        { "id": "uva",      "nome": "Uva",      "tipo": "sementes", "img": "../img/uva.png" },
        { "id": "abacaxi",  "nome": "Abacaxi",  "tipo": "sem-semente-visivel", "img": "../img/abacaxi.png" },
        { "id": "morango",  "nome": "Morango",  "tipo": "aquenios", "img": "../img/morango.png" },
        { "id": "banana",   "nome": "Banana",   "tipo": "sem-semente", "img": "../img/banana.png" }
      ],
      "corretos": ["melancia", "kiwi", "uva"]
    }
  ] } ] };

  /* ---- Estado do jogo ---- */
  let gameData         = null;
  let nivelIdx         = 0;
  let prateleira       = [];      // ordenação (médio/difícil)
  let prateleiraStatus = [];      // 'ok' | 'erro' | '' por slot (médio/difícil)
  let selecionados     = [];      // seleção (fácil)
  let erros            = 0;
  let touchItem        = null;
  let touchGhost       = null;
  let boasVindasExibido = false;  // mostra instrucaoInstrutor apenas uma vez
  let nivelTreino      = null;    // frutas de treino do tutorial do Logi (null fora do tutorial)

  /* Nível em uso: o de treino enquanto o tutorial está aberto, senão o da fase */
  const nivelAtual = () => nivelTreino || gameData.niveis[nivelIdx];

  const ERROS_KEY = 'despensa_erros';

  /* Cores para exibição visual do nível Fácil (círculo fallback sem imagem) */
  const COR_CARD = {
    vermelho: '#E53935',
    amarelo:  '#FDD835',
    roxo:     '#7E57C2',
    azul:     '#283593',
    verde:    '#2E7D32'
  };

  /* ================================================================
     INICIALIZAÇÃO
  ================================================================ */
  async function init() {
    try {
      gameData = await loadGameData('../data/despensa.json');
    } catch(e) {
      gameData = DESPENSA_INLINE;
    }

    /* Item 2.3 — sorteia uma variação (mín. 4) a cada entrada real na Despensa */
    let variacoesData;
    try {
      variacoesData = await loadGameData('../data/despensa-variacoes.json');
    } catch(e) {
      variacoesData = DESPENSA_VARIACOES_INLINE;
    }
    const variacaoIdx = gameState.iniciarVariacao('despensa', variacoesData.variacoes.length);
    const variacao = variacoesData.variacoes[variacaoIdx];
    gameData.niveis.forEach((nivel, i) => {
      if (variacao.niveis[i]) Object.assign(nivel, variacao.niveis[i]);
    });

    nivelIdx = Math.min(gameState.getEstagio('despensa'), gameData.niveis.length - 1);
    erros = Math.max(0, parseInt(localStorage.getItem(ERROS_KEY) || '0', 10) || 0);

    /* Item 1 — fala de boas-vindas exibida uma única vez */
    document.getElementById('logi-boas-vindas').textContent = gameData.instrucaoInstrutor;
    boasVindasExibido = true;

    renderNivel();
  }

  /* ================================================================
     RENDER NÍVEL
  ================================================================ */
  function renderNivel() {
    const nivel = gameData.niveis[nivelIdx];

    /* Item 1 — instrução ativa do nível (destaque); palavras em MAIÚSCULAS ganham marca */
    destacarPalavras(document.getElementById('logi-instrucao'), nivel.instrucao);

    /* Item 10 — legenda cromática no balão (apenas no nível Fácil) */
    const legendaCor = document.getElementById('logi-legenda-cor');
    legendaCor.style.display = nivel.criterio === 'selecao-cor' ? 'flex' : 'none';

    /* Subtítulo HUD */
    document.getElementById('hud-subtitulo').textContent =
      `Nível ${nivelIdx + 1} de ${gameData.niveis.length}`;

    /* Reset de estado */
    prateleira       = [];
    prateleiraStatus = [];
    selecionados     = [];

    /* Mostrar/ocultar prateleira conforme o critério */
    const mostraPrateleira = nivel.criterio !== 'selecao-cor';
    organizarPainelNivel(nivel, mostraPrateleira);
    document.getElementById('painel-prateleira').style.display = mostraPrateleira ? '' : 'none';

    /* Rótulo do painel de itens */
    document.getElementById('painel-itens-label').textContent =
      nivel.criterio === 'selecao-cor'
        ? 'Escolha as frutas vermelhas'
        : nivel.criterio === 'selecao-sementes'
          ? 'Clique ou arraste as frutas com sementes'
          : 'Itens para organizar — clique ou arraste para a prateleira';

    /* Legenda da prateleira */
    if (mostraPrateleira) {
      const esq = document.getElementById('leg-esq');
      const dir = document.getElementById('leg-dir');
      if (nivel.criterio === 'tamanho')   { esq.textContent = 'menor';   dir.textContent = 'maior';  }
      else if (nivel.criterio === 'selecao-sementes') { esq.textContent = 'escolhas'; dir.textContent = '3 frutas'; }
      else                                { esq.textContent = 'primeiro'; dir.textContent = 'último'; }
      destacarPalavras(document.getElementById('prateleira-label'), nivel.instrucao);
    }

    buildNivelTabs();
    buildItens(nivel);
    if (mostraPrateleira) renderPrateleira(nivel);

    document.getElementById('feedback-area').style.display = 'none';
    pararAtencaoDica();
    atualizarBadge();
    /* Tutorial do Logi: só no nível Fácil, e só na 1ª vez */
    Tutorial.auto(despensaTutorial.tutorialDaFase());
  }

  /* Escreve o texto no elemento e põe <mark> nas palavras em MAIÚSCULAS (3+ letras).
     Monta com nós de texto, sem innerHTML. */
  function destacarPalavras(el, texto) {
    el.textContent = '';
    String(texto).split(/((?<!\p{L})\p{Lu}{3,}(?!\p{L}))/u).forEach((parte, i) => {
      if (!parte) return;
      if (i % 2 === 1) {
        const m = document.createElement('mark');
        m.className = 'destaque-palavra' + (/^VERMELH[AO]S?$/.test(parte) ? ' destaque-palavra--vermelha' : '');
        m.textContent = parte;
        el.appendChild(m);
      } else {
        el.appendChild(document.createTextNode(parte));
      }
    });
  }

  function organizarPainelNivel(nivel, mostraPrateleira) {
    const workGrid = document.getElementById('despensa-work-grid');
    const painelItens = document.getElementById('painel-itens');
    const painelPrateleira = document.getElementById('painel-prateleira');
    const prateleiraAcima = nivel.criterio === 'tamanho' || nivel.criterio === 'selecao-sementes';

    workGrid.classList.toggle('despensa-work-grid--prateleira-acima', prateleiraAcima);
    workGrid.classList.toggle('despensa-work-grid--com-prateleira', mostraPrateleira);
    workGrid.classList.toggle('despensa-work-grid--sementes', nivel.criterio === 'selecao-sementes');

    if (prateleiraAcima) {
      workGrid.insertBefore(painelPrateleira, painelItens);
    } else {
      workGrid.insertBefore(painelItens, painelPrateleira);
    }
  }

  /* ================================================================
     ABAS DE NÍVEL
  ================================================================ */
  function buildNivelTabs() {
    const cont = document.getElementById('niveis-tabs');
    cont.innerHTML = '';
    gameData.niveis.forEach((n, i) => {
      const span = document.createElement('span');
      if (i < nivelIdx)        span.className = 'nivel nivel--ok';
      else if (i === nivelIdx) span.className = 'nivel nivel--ativo';
      else                     span.className = 'nivel nivel--bloq';
      span.textContent = n.nivel + (i < nivelIdx ? ' ✓' : i === nivelIdx ? ' ←' : '');
      cont.appendChild(span);
    });
  }

  /* ================================================================
     CONSTRUÇÃO DOS ITENS
     - selecao-cor: click para toggle, sem drag
     - tamanho: drag + touch
     - selecao-sementes: click ou drag para selecionar na prateleira
  ================================================================ */
  function labelTamanho(valor) {
    const labels = {
      1: 'muito pequeno',
      2: 'pequeno',
      3: 'médio',
      4: 'grande',
      5: 'muito grande'
    };
    return labels[valor] || `tamanho ${valor}`;
  }

  function textoTamanho(valor) {
    return `tam. ${valor}: ${labelTamanho(valor)}`;
  }

  function tamanhoImagemPx(valor, compacto = false) {
    const tamanho = Number(valor || 3);
    return compacto
      ? 20 + (tamanho - 1) * 9
      : 28 + (tamanho - 1) * 13;
  }

  function buildItens(nivel) {
    const cont = document.getElementById('itens-grid');
    cont.innerHTML = '';
    cont.classList.remove('tem-selecao');
    cont.classList.toggle('despensa-itens-grid--tamanho', nivel.criterio === 'tamanho');

    nivel.itens.forEach(item => {
      const card = document.createElement('article');
      card.className = 'item-card';
      card.dataset.itemId = item.id;
      card.setAttribute('role', 'option');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-selected', 'false');

      /* --- HTML da imagem — usa item.img vindo do JSON --- */
      let imgHtml;

      if (nivel.criterio === 'selecao-cor') {
        /* Glow vermelho subliminar em frutas vermelhas */
        if (item.cor === 'vermelho') card.classList.add('item-card--vermelho-hint');

        if (item.img) {
          imgHtml = `<img src="${item.img}" alt=""
            class="item-card__emoji" style="width:48px;height:48px;object-fit:contain;display:block;margin:0 auto;">`;
        } else {
          /* Círculo colorido para frutas sem imagem (ex: morango) */
          imgHtml = `<span class="item-card__circulo"
            style="background:${COR_CARD[item.cor] || '#ccc'};"
            aria-hidden="true"></span>`;
        }
        card.setAttribute('aria-label', `${item.nome}, cor ${item.cor} — clique para selecionar`);

      } else if (nivel.criterio === 'tamanho') {
        const px = tamanhoImagemPx(item.tamanho);
        card.classList.add('item-card--tamanho');
        card.style.setProperty('--item-img-size', `${px}px`);
        card.style.setProperty('--item-card-height', `${78 + Number(item.tamanho || 3) * 14}px`);
        imgHtml = `<img src="${item.img || ''}" alt=""
          class="item-card__emoji item-card__emoji--tamanho">`;
        card.setAttribute('aria-label', `${item.nome}, ${textoTamanho(item.tamanho)} — clique ou arraste para a prateleira`);

      } else {
        imgHtml = `<img src="${item.img || ''}" alt=""
          class="item-card__emoji" style="width:40px;height:40px;object-fit:contain;">`;
        card.setAttribute(
          'aria-label',
          nivel.criterio === 'selecao-sementes'
            ? `${item.nome} — clique ou arraste para escolher`
            : `${item.nome} — arraste para a prateleira`
        );
      }

      card.dataset.defaultAriaLabel = card.getAttribute('aria-label');

      card.innerHTML = `
        <p class="item-card__nome">${item.nome}</p>
        ${imgHtml}
      `;

      /* --- Eventos --- */
      if (nivel.criterio === 'selecao-cor') {
        /* Item 6 — seleção por clique/tap */
        card.addEventListener('click', () => toggleSelecao(item.id));
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSelecao(item.id); }
        });
      } else {
        /* Médio e Difícil: drag + touch */
        card.draggable = true;
        card.addEventListener('dragstart', e => {
          e.dataTransfer.setData('itemId', item.id);
        });
        card.addEventListener('touchstart', touchStart, { passive: true });
        card.addEventListener('touchmove',  touchMove,  { passive: false });
        card.addEventListener('touchend',   touchEnd,   { passive: true });
        /* Clique/Enter alterna: tocar de novo numa fruta que já está na prateleira a tira de lá */
        card.addEventListener('click', () => adicionarItem(item.id, true));
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); adicionarItem(item.id, true); }
        });
      }

      cont.appendChild(card);
    });

    atualizarItensDisponiveis();
  }

  /* ================================================================
     SELEÇÃO (nível Fácil — item 6, 8)
  ================================================================ */
  function toggleSelecao(id, origem) {
    /* Com o tutorial aberto, a escolha da criança passa pelo Logi (acerta ou encoraja) */
    if (window.Tutorial?.ativo && origem !== 'tutorial') {
      Tutorial.tentar('selecionar', id, () => toggleSelecao(id, 'tutorial'));
      return;
    }
    pararAtencaoDica();
    const idx = selecionados.indexOf(id);
    if (idx >= 0) {
      selecionados.splice(idx, 1);
    } else {
      selecionados.push(id);
    }
    audio.clique();

    const grid = document.getElementById('itens-grid');
    /* Item 8 — esmaecer não-selecionados quando há seleção ativa */
    grid.classList.toggle('tem-selecao', selecionados.length > 0);

    grid.querySelectorAll('.item-card').forEach(card => {
      const cid = card.dataset.itemId;
      const selecionado = selecionados.includes(cid);
      card.classList.toggle('item-card--selecionado', selecionado);
      card.setAttribute('aria-selected', selecionado ? 'true' : 'false');
      card.classList.remove('item-card--incorreto'); // limpa erro ao tocar
    });

    document.getElementById('feedback-area').style.display = 'none';
  }

  /* Marca visualmente quais itens selecionados estão errados */
  function marcarSelecaoErrada(nivel) {
    document.getElementById('itens-grid').querySelectorAll('.item-card').forEach(card => {
      const cid = card.dataset.itemId;
      if (selecionados.includes(cid) && !nivel.corretos.includes(cid)) {
        card.classList.add('item-card--incorreto');
        card.classList.remove('item-card--selecionado');
        card.setAttribute('aria-selected', 'true');
      }
    });
  }

  function atualizarItensDisponiveis() {
    if (!gameData) return;
    const nivel = nivelAtual();
    const grid = document.getElementById('itens-grid');

    grid.querySelectorAll('.item-card').forEach(card => {
      const id = card.dataset.itemId;

      if (nivel.criterio === 'selecao-cor') {
        const selecionado = selecionados.includes(id);
        card.setAttribute('aria-selected', selecionado ? 'true' : 'false');
        return;
      }

      const naPrateleira = prateleira.includes(id);
      card.classList.toggle('item-card--na-prateleira', naPrateleira);
      card.setAttribute('aria-selected', naPrateleira ? 'true' : 'false');
      card.setAttribute(
        'aria-label',
        naPrateleira
          ? `${card.querySelector('.item-card__nome')?.textContent || id} já está na prateleira. Clique de novo para tirar.`
          : card.dataset.defaultAriaLabel
      );
    });
  }

  /* ================================================================
     PRATELEIRA (médio / difícil)
  ================================================================ */
  function renderPrateleira(nivel) {
    if (!nivel) nivel = nivelAtual();
    const total = nivel.criterio === 'selecao-sementes'
      ? nivel.corretos.length
      : nivel.itens.length;
    const cont  = document.getElementById('prateleira');
    cont.innerHTML = '';

    for (let i = 0; i < total; i++) {
      const slot = document.createElement(i < prateleira.length ? 'button' : 'span');

      if (i < prateleira.length) {
        const id   = prateleira[i];
        const item = nivel.itens.find(it => it.id === id);
        const status = prateleiraStatus[i]; // 'ok' | 'erro' | ''
        const imgSize = nivel.criterio === 'tamanho' && item?.tamanho
          ? tamanhoImagemPx(item.tamanho)
          : 52;

        /* Item 2 — manter itens + destacar erros com borda vermelha */
        if (status === 'erro') {
          slot.className = 'prateleira__slot prateleira__slot--erro';
        } else if (status === 'ok') {
          slot.className = 'prateleira__slot prateleira__slot--ok';
        } else {
          slot.className = 'prateleira__slot';
        }

        const textoStatus = status === 'erro' ? 'incorreto' : status === 'ok' ? 'correto' : '';
        slot.setAttribute(
          'aria-label',
          `${item?.nome || id}, posição ${i+1}${textoStatus ? `, ${textoStatus}` : ''}. Clique para remover.`
        );
        slot.setAttribute('type', 'button');

        const imgSrc = item?.img || '';
        slot.innerHTML = `
          <img src="${imgSrc}" alt="" class="prateleira__slot-img" style="--slot-img:${imgSize}px;">
          <span class="prateleira__slot-pos">${i+1}º</span>
          ${textoStatus
            ? `<span class="prateleira__slot-status" aria-hidden="true">${status === 'erro' ? '✕' : '✓'}</span>`
            : '<span class="bloco-remover" aria-hidden="true">×</span>'}
        `;
        slot.addEventListener('click', () => removerItem(i));

      } else {
        slot.className = 'prateleira__slot';
        slot.textContent = `${i+1}º`;
        slot.setAttribute('aria-label', `Slot ${i+1} — vazio`);
      }

      cont.appendChild(slot);
    }

    atualizarItensDisponiveis();

    cont.ondragover = e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      cont.classList.add('despensa-prateleira--dragover');
    };
    cont.ondragleave = e => {
      if (!cont.contains(e.relatedTarget)) {
        cont.classList.remove('despensa-prateleira--dragover');
      }
    };
    cont.ondrop     = e => {
      e.preventDefault();
      cont.classList.remove('despensa-prateleira--dragover');
      const id = e.dataTransfer.getData('itemId');
      if (id) adicionarItem(id);
    };
  }

  /* `alternar`: vem de clique/Enter na fruta (tira se já estiver na prateleira).
     Arrastar ou soltar uma fruta que já está lá não faz nada. */
  function adicionarItem(id, alternar = false, origem) {
    /* Com o tutorial aberto, a escolha da criança passa pelo Logi (acerta ou encoraja) */
    if (window.Tutorial?.ativo && origem !== 'tutorial') {
      Tutorial.tentar('adicionar', id, () => adicionarItem(id, false, 'tutorial'));
      return;
    }
    const nivel = nivelAtual();
    const limite = nivel.criterio === 'selecao-sementes'
      ? nivel.corretos.length
      : nivel.itens.length;
    const ja = prateleira.indexOf(id);
    if (ja >= 0) {
      if (alternar) { audio.clique(); removerItem(ja); }
      return;
    }
    if (prateleira.length >= limite) return;
    pararAtencaoDica();
    prateleira.push(id);
    prateleiraStatus = []; // limpa status ao adicionar novo item
    audio.clique();
    renderPrateleira(nivel);
    document.getElementById('feedback-area').style.display = 'none';
  }

  function removerItem(idx) {
    if (window.Tutorial?.ativo) return;   /* no treino, a criança não tira frutas da prateleira */
    prateleira.splice(idx, 1);
    prateleiraStatus = [];
    renderPrateleira(nivelAtual());
    document.getElementById('feedback-area').style.display = 'none';
  }

  /* ================================================================
     TOUCH DRAG (médio / difícil)
  ================================================================ */
  function touchStart(e) {
    touchItem = e.currentTarget.dataset.itemId;
    const touch = e.touches[0];
    touchGhost = e.currentTarget.cloneNode(true);
    touchGhost.style.cssText =
      `position:fixed;opacity:0.75;pointer-events:none;z-index:9999;` +
      `left:${touch.clientX - 30}px;top:${touch.clientY - 30}px;width:80px;`;
    document.body.appendChild(touchGhost);
  }

  function touchMove(e) {
    e.preventDefault();
    if (!touchGhost) return;
    const t = e.touches[0];
    touchGhost.style.left = (t.clientX - 30) + 'px';
    touchGhost.style.top  = (t.clientY - 30) + 'px';
  }

  function touchEnd(e) {
    if (touchGhost) { touchGhost.remove(); touchGhost = null; }
    if (!touchItem) return;
    const touch = e.changedTouches[0];
    const el    = document.elementFromPoint(touch.clientX, touch.clientY);
    const prat  = document.getElementById('prateleira');
    if (prat && (prat === el || prat.contains(el))) adicionarItem(touchItem);
    touchItem = null;
  }

  /* ================================================================
     CONFIRMAÇÃO
  ================================================================ */
  function confirmar() {
    if (window.Tutorial?.ativo) return;
    const nivel = gameData.niveis[nivelIdx];

    if (nivel.criterio === 'selecao-cor') {
      confirmarSelecao(nivel);
    } else if (nivel.criterio === 'selecao-sementes') {
      confirmarSelecaoSementes(nivel);
    } else {
      confirmarOrdenacao(nivel);
    }
  }

  function registrarErro() {
    erros++;
    localStorage.setItem(ERROS_KEY, erros);
    ativarAtencaoDica();
  }

  /* --- Validação do nível Fácil (seleção de cor) --- */
  function confirmarSelecao(nivel) {
    if (selecionados.length === 0) {
      audio.erro();
      mostrarFeedback('Toque nas frutas para selecioná-las primeiro!', 'ambar');
      return;
    }

    const corretos     = nivel.corretos;
    const todasCorretas = corretos.every(id => selecionados.includes(id));
    const nenhumaErrada = selecionados.every(id => corretos.includes(id));

    if (todasCorretas && nenhumaErrada) {
      mostrarFeedback('Correto! As frutas selecionadas são vermelhas.', 'verde');
      setTimeout(() => nivelConcluido(nivel), 400);
    } else {
      registrarErro();
      audio.erro();

      /* Item 3 — feedback granular: nome do primeiro item errado */
      const erradoId = selecionados.find(id => !corretos.includes(id));
      if (erradoId) {
        const erradoItem = nivel.itens.find(it => it.id === erradoId);
        mostrarFeedback(
          `${erradoItem?.nome || erradoId} não é vermelha. Tente remover!`,
          'erro'
        );
        marcarSelecaoErrada(nivel);
      } else {
        /* Selecionou apenas corretas mas faltou alguma */
        mostrarFeedback(
          `Faltou selecionar uma fruta! Continue procurando.`,
          'ambar'
        );
      }
      /* Item 2 — NÃO limpar a seleção: criança corrige manualmente */
    }
  }

  /* --- Validação do nível Difícil (seleção por click/arraste) --- */
  function confirmarSelecaoSementes(nivel) {
    const total = nivel.corretos.length;

    if (prateleira.length < total) {
      audio.erro();
      mostrarFeedback('Escolha 3 frutas antes de confirmar!', 'ambar');
      return;
    }

    const corretos = nivel.corretos;
    const todasCorretas = corretos.every(id => prateleira.includes(id));
    const nenhumaErrada = prateleira.every(id => corretos.includes(id));

    prateleiraStatus = prateleira.map(id => corretos.includes(id) ? 'ok' : 'erro');

    if (todasCorretas && nenhumaErrada) {
      mostrarFeedback('Correto! Você escolheu as frutas com sementes por dentro.', 'verde');
      prateleiraStatus = [];
      setTimeout(() => nivelConcluido(nivel), 400);
      return;
    }

    registrarErro();
    audio.erro();
    renderPrateleira(nivel);

    const erradoId = prateleira.find(id => !corretos.includes(id));
    const erradoItem = nivel.itens.find(it => it.id === erradoId);

    if (erradoId === 'morango') {
      mostrarFeedback(
        'No morango, os pontinhos de fora são aquênios. Neste desafio, ele não conta como fruta com sementes por dentro. Remova o morango e tente de novo!',
        'erro'
      );
      return;
    }

    mostrarFeedback(
      `${erradoItem?.nome || erradoId} não é uma das frutas com sementes por dentro neste desafio. Remova o item destacado e tente de novo!`,
      'erro'
    );
  }

  /* --- Validação do nível Médio (ordenação) --- */
  function confirmarOrdenacao(nivel) {
    const total = nivel.itens.length;
    if (prateleira.length < total) {
      audio.erro();
      mostrarFeedback('Coloque todos os itens na prateleira primeiro!', 'ambar');
      return;
    }

    const correta = nivel.ordemCorreta;
    let   acertos = 0;

    /* Calcula status por posição */
    prateleiraStatus = prateleira.map((id, i) => {
      const ok = id === correta[i];
      if (ok) acertos++;
      return ok ? 'ok' : 'erro';
    });

    if (acertos === total) {
      mostrarFeedback('Correto! Os itens estão do menor para o maior.', 'verde');
      prateleiraStatus = [];
      setTimeout(() => nivelConcluido(nivel), 400);
    } else {
      registrarErro();
      audio.erro();

      /* Item 2 — manter itens, destacar erros (sem setTimeout que limpava) */
      renderPrateleira(nivel); // re-renderiza com status colorido

      /* Item 3 — feedback granular: nome do primeiro item na posição errada */
      let msg = '';
      for (let i = 0; i < prateleira.length; i++) {
        if (prateleira[i] !== correta[i]) {
          const item = nivel.itens.find(it => it.id === prateleira[i]);
          msg = `"${item?.nome || prateleira[i]}" está na posição ${i+1} errada. Tente mover!`;
          break;
        }
      }
      if (!msg) msg = `${acertos} de ${total} certos. Ajuste os itens marcados com ✕!`;

      mostrarFeedback(msg, 'erro');
    }
  }

  /* ================================================================
     CONCLUSÃO DE NÍVEL
  ================================================================ */
  function nivelConcluido(nivel) {
    const proxNivel = nivelIdx + 1;
    const temProx   = proxNivel < gameData.niveis.length;

    if (temProx) {
      gameState.setEstagio('despensa', proxNivel);
      audio.desbloqueio();
      mostrarFeedback(`Nível ${nivel.nivel} concluído! Próximo nível desbloqueado.`, 'ambar');
      setTimeout(() => {
        nivelIdx = proxNivel;
        renderNivel();
      }, 1200);
    } else {
      gameState.limparEstagio('despensa');
      const score = gameState.calcularScore(erros);
      gameState.setRoomScore('despensa', score);
      localStorage.removeItem(ERROS_KEY);
      atualizarBadge(score);
      if (gameState.isFullyCompleted()) {
        audio.conclusao();
        window.removeEventListener('beforeunload', beforeUnloadHandler);
        setTimeout(() => { window.location.href = 'TelaPontuacao.html'; }, 850);
        return;
      }
      exibirModal(score);
      audio.conclusao();
    }
  }

  function exibirModal(score) {
    const estrelas = gameState.getStars(score);
    const elEst = document.getElementById('modal-estrelas');
    elEst.innerHTML = '';
    elEst.setAttribute('aria-label', `${estrelas} de 3 estrelas conquistadas`);
    for (let i = 0; i < 3; i++) {
      const img = document.createElement('img');
      img.src = '../img/estrela.png';
      img.alt = '';
      img.className = i < estrelas ? 'modal-estrela-img' : 'modal-estrela-img modal-estrela-img--vazia';
      elEst.appendChild(img);
    }
    document.getElementById('modal-sub').textContent  = 'Você organizou todos os níveis da despensa!';
    document.getElementById('modal-pts').textContent  = `Pontuação: ${score} / 25 pts`;
    document.getElementById('btn-proximo-nivel').style.display = 'none';
    abrirModalFluxoAcessivel(document.getElementById('modal-conclusao'));
    window.removeEventListener('beforeunload', beforeUnloadHandler);
  }

  /* ================================================================
     UTILITÁRIOS
  ================================================================ */
  function mostrarFeedback(msg, tipo) {
    const dica = document.getElementById('feedback-dica');
    const txt  = document.getElementById('feedback-texto');
    dica.className  = `dica dica--${tipo}`;
    txt.className   = `dica__texto dica__texto--${tipo}`;
    txt.textContent = msg;
    document.getElementById('feedback-area').style.display = 'block';
  }

  function atualizarBadge(score) {
    const s = score !== undefined ? score : (gameState.get().scores.despensa || 0);
    document.getElementById('badge-pts').textContent = s + ' pts';
  }

  /* ================================================================
     EVENTOS E INICIALIZAÇÃO
  ================================================================ */
  function beforeUnloadHandler() {
    sendFinalScore({ score: gameState.getTotalScore(), difficulty: getPlatformDifficulty() });
  }
  window.addEventListener('beforeunload', beforeUnloadHandler);

  /* ---- Ajuda (Como jogar / Objetivo) ---- */
  function abrirModalAjuda() {
    const modal = document.getElementById('modal-ajuda');
    try { ComoJogar.irParaFase('despensa', nivelIdx); } catch (e) {}
    abrirTutorialAcessivel(modal, document.getElementById('btn-ajuda'));
  }
  function fecharModalAjuda() {
    fecharTutorialAcessivel(document.getElementById('modal-ajuda'));
  }

  document.getElementById('btn-ajuda').addEventListener('click', abrirModalAjuda);
  document.getElementById('modal-ajuda-fechar').addEventListener('click', fecharModalAjuda);
  document.getElementById('modal-ajuda').addEventListener('click', e => {
    if (e.target.id === 'modal-ajuda') fecharModalAjuda();
  });

  /* ---- Item 2.2 — ESC sai do mini-game (ou só fecha o modal de ajuda, se estiver aberto) ---- */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('modal-ajuda').style.display === 'flex') { fecharModalAjuda(); return; }
    if (document.getElementById('modal-conclusao').style.display === 'flex') return;
    gameState.sairMiniGame('despensa', 'MapaCasa.html');
  });

  document.getElementById('btn-confirmar').addEventListener('click', () => { if (gameData) confirmar(); });

  document.getElementById('btn-limpar').addEventListener('click', () => {
    if (!gameData || window.Tutorial?.ativo) return;
    const nivel = gameData.niveis[nivelIdx];
    if (nivel.criterio === 'selecao-cor') {
      selecionados = [];
      document.getElementById('itens-grid').classList.remove('tem-selecao');
      document.getElementById('itens-grid').querySelectorAll('.item-card').forEach(c => {
        c.classList.remove('item-card--selecionado', 'item-card--incorreto');
        c.setAttribute('aria-selected', 'false');
      });
    } else {
      prateleira       = [];
      prateleiraStatus = [];
      renderPrateleira(nivel);
    }
    document.getElementById('feedback-area').style.display = 'none';
  });

  /* ---- Dica do Logi: aponta a fruta errada ou a próxima a escolher (não conta erro nem ponto) ---- */
  function ativarAtencaoDica() { document.getElementById('btn-dica').classList.add('btn-dica--pulsar'); }
  function pararAtencaoDica() { document.getElementById('btn-dica').classList.remove('btn-dica--pulsar'); }

  function passosDaDica() {
    const nivel = gameData.niveis[nivelIdx];
    const d = nivel.dica || {};
    const marcas = txt => txt.match(/(?<!\p{L})\p{Lu}{3,}(?!\p{L})/gu) || [];
    const passo = (destaque, fala) => ({ destaque, fala, palavraChave: marcas(fala) });
    const carta = id => document.querySelector(`#itens-grid [data-item-id="${id}"]`);
    const casa = i => document.querySelector(`#prateleira .prateleira__slot:nth-child(${i + 1})`);
    const confirmar = () => [passo('#btn-confirmar', 'Tudo certo! Toque em CONFIRMAR.')];

    if (nivel.criterio === 'selecao-cor') {
      const errada = selecionados.find(id => !nivel.corretos.includes(id));
      if (errada) return [passo(carta(errada), d.errado)];
      const falta = nivel.corretos.find(id => !selecionados.includes(id));
      return falta ? [passo(carta(falta), d.certo)] : confirmar();
    }
    if (nivel.criterio === 'tamanho') {
      const i = prateleira.findIndex((id, k) => id !== nivel.ordemCorreta[k]);
      if (i >= 0) return [passo(casa(i), d.errado)];
      if (prateleira.length < nivel.ordemCorreta.length) return [passo(carta(nivel.ordemCorreta[prateleira.length]), d.certo)];
      return confirmar();
    }
    /* selecao-sementes */
    const i = prateleira.findIndex(id => !nivel.corretos.includes(id));
    if (i >= 0) return [passo(casa(i), d.errado)];
    const falta = nivel.corretos.find(id => !prateleira.includes(id));
    return falta ? [passo(carta(falta), d.certo)] : confirmar();
  }

  document.getElementById('btn-dica').addEventListener('click', () => {
    if (!gameData || window.Tutorial?.ativo) return;
    audio.clique();
    pararAtencaoDica();
    Tutorial.dica({ comodo: 'despensa', passos: passosDaDica() });
  });

  /* ---- Tutorial do Logi: treino com frutas de teste (nível Fácil) ---- */
  let salvoTutorial = null;

  const despensaTutorial = {
    comodo: 'despensa',
    /* Um tutorial por nível: Fácil (cor), Médio (tamanho) e Difícil (sementes) */
    tutorialDaFase: () => ({
      'selecao-cor': 'despensa-f1',
      'tamanho': 'despensa-f2',
      'selecao-sementes': 'despensa-f3'
    })[gameData?.niveis[nivelIdx]?.criterio] || null,
    primeiroFoco: () => document.querySelector('#itens-grid .item-card'),

    /* A tela já está no layout do nível; só trocamos as frutas pelas de treino */
    preparar(def) {
      const t = def.treino;
      salvoTutorial = { selecionados: [...selecionados], prateleira: [...prateleira] };
      selecionados = [];
      prateleira = [];
      prateleiraStatus = [];
      nivelTreino = { criterio: t.criterio || 'selecao-cor', itens: t.itens, corretos: t.corretos, ordemCorreta: t.ordemCorreta };
      document.getElementById('feedback-area').style.display = 'none';
      buildItens(nivelTreino);
      if (nivelTreino.criterio !== 'selecao-cor') {
        if (nivelTreino.criterio === 'selecao-sementes') {
          document.getElementById('leg-dir').textContent = `${nivelTreino.corretos.length} frutas`;
        }
        renderPrateleira(nivelTreino);
      }
    },

    restaurar() {
      const salvo = salvoTutorial;
      salvoTutorial = null;
      nivelTreino = null;
      renderNivel();
      if (!salvo) return;
      salvo.selecionados.forEach(id => toggleSelecao(id, 'tutorial'));
      if (salvo.prateleira.length) {
        prateleira = [...salvo.prateleira];
        renderPrateleira();
      }
    },

    acoes: {
      selecionar: id => toggleSelecao(id, 'tutorial'),
      adicionar: id => adicionarItem(id, false, 'tutorial'),
      /* Fim do treino: as frutas da prateleira ficam com ✓ verde (sem contar erro nem ponto) */
      marcarCertas() {
        prateleiraStatus = prateleira.map(() => 'ok');
        renderPrateleira();
      },
      balancar(id) {
        const el = document.querySelector(`#itens-grid [data-item-id="${id}"]`);
        if (!el) return;
        el.classList.remove('tut-balanca');
        void el.offsetWidth;
        el.classList.add('tut-balanca');
      }
    }
  };

  Tutorial.configurar(despensaTutorial);
  init();
  </script>

</body>
</html>
