<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontuação — A Casa dos Mistérios Lógicos</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/pontuacao.css">
</head>
<body>
  <section class="tela tela--pontuacao" id="tela-pontuacao">

    <section class="resultado-header">
      <img src="../img/logi_feliz.png" alt="" class="resultado-header__logi" id="resultado-logi">
      <span class="resultado-header__icone" id="resultado-icone" role="img" aria-label="Troféu"></span>
      <h1 class="resultado-header__titulo" id="resultado-titulo">Continue explorando!</h1>
      <p class="resultado-header__sub" id="resultado-sub"></p>
    </section>

    <section class="pontuacao-total">
      <p class="pontuacao-total__label">Pontuação total</p>
      <p class="pontuacao-total__numero" id="pontuacao-final">0</p>
      <p class="pontuacao-total__de">de 100 pontos</p>
    </section>

    <section class="pontuacao-grid" id="pontuacao-grid" aria-label="Pontuação por cômodo"></section>

    <section class="dica dica--ambar pontuacao-feedback" id="dica-feedback">
      <img src="../img/logi_feliz.png" alt="" class="pontuacao-logi-img">
      <p class="dica__texto dica__texto--ambar" id="feedback-texto">Continue assim!</p>
    </section>

    <section class="btn-grupo" id="acoes-resultado">
      <button class="btn btn--laranja" id="btn-jogar-novamente" aria-label="Jogar novamente">Jogar novamente</button>
      <button class="btn btn--menu-resultado" id="btn-menu-principal" aria-label="Voltar ao menu principal">Menu principal</button>
    </section>
  </section>

  <script src="../js/plataforma.js"></script>
  <script src="../js/gameState.js"></script>
  <script src="../js/pontuacao.js"></script>
</body>
</html>
