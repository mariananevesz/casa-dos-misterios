  let gameData   = null;
  let faseAtual = 0;
  let corrigida  = [];
  let verificado = false;
  let erros      = 0;
  let touchBloco = null;
  let touchGhost = null;
  let faseMontada = null; /* { blocos, passos, total, intrusosRevelados } da fase atual */

  const CHAVE_ULTIMOS_INTRUSOS = 'quarto_ultimos_intrusos';

  function embaralhar(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* Sorteia intrusos evitando repetir os da última partida (rotação a cada jogada) */
  /* Sorteia o último passo (como chega à escola), evitando repetir o da partida anterior */
  function sortearFinal() {
    let ultimo = null;
    try { ultimo = localStorage.getItem('quarto_ultimo_final'); } catch(e) {}
    const opcoes = gameData.finais.filter(id => id !== ultimo);
    const id = opcoes[Math.floor(Math.random() * opcoes.length)];
    try { localStorage.setItem('quarto_ultimo_final', id); } catch(e) {}
    return id;
  }

  function sortearIntrusos(qtd) {
    if (qtd <= 0) return [];
    let ultimos = [];
    try { ultimos = JSON.parse(localStorage.getItem(CHAVE_ULTIMOS_INTRUSOS) || '[]'); } catch(e) {}
    const novos = embaralhar(gameData.intrusos.filter(id => !ultimos.includes(id))).slice(0, qtd);
    if (novos.length < qtd) {
      const resto = embaralhar(gameData.intrusos.filter(id => !novos.includes(id)));
      novos.push(...resto.slice(0, qtd - novos.length));
    }
    return novos;
  }

  function salvarIntrusos(ids) {
    try { localStorage.setItem(CHAVE_ULTIMOS_INTRUSOS, JSON.stringify(ids)); } catch(e) {}
  }

  /* Monta os blocos da fase: passos corretos + repetido (fácil) ou intrusos (médio/difícil) */
  function montarFase(fase) {
    const rotulo = id => gameData.blocos[id];
    const final = fase.passos.flat().includes('@final') ? sortearFinal() : null;
    const passos = fase.passos.map(g => g.map(id => id === '@final' ? final : id));
    const corretos = passos.flat();
    const blocos = corretos.map(id => ({ id, rotulo: rotulo(id), erro: false, visivel: false }));

    for (let i = 0; i < (fase.repetidos || 0); i++) {
      const id = corretos[Math.floor(Math.random() * corretos.length)];
      blocos.push({ id, rotulo: rotulo(id), erro: true, visivel: false, motivo: 'repetido' }); /* repetição: só fica vermelha na dica */
    }
    const intrusos = sortearIntrusos(fase.intrusos || 0);
    intrusos.forEach(id => blocos.push({ id, rotulo: rotulo(id), erro: true, visivel: false, motivo: 'intruso' })); /* só fica vermelho na dica */

    let ordem;
    let tentativas = 0;
    do {
      ordem = embaralhar(blocos);
      tentativas++;
    } while (tentativas < 10 && ordem.slice(0, corretos.length).every((b, i) => b.id === corretos[i]));

    return { blocos: ordem, passos, ordem: fase.ordem || [], total: corretos.length, intrusos, temErro: blocos.some(b => b.erro), intrusosRevelados: false };
  }

  /* Cada posição pertence a um grupo (ex.: banho primeiro, @final por último); dentro do grupo
     a ordem é livre, sem repetir item, EXCETO pelas regras "ordem": [antes, depois]
     (ex.: calça e meia antes do tênis; a camiseta pode vir em qualquer lugar do grupo). */
  function validarPosicoes(passos, escolhidos, ordem = []) {
    const resultado = [];
    let pos = 0;
    passos.forEach(grupo => {
      const usados = [];
      grupo.forEach(() => {
        const id = escolhidos[pos];
        let ok = grupo.includes(id) && !usados.includes(id);
        if (ok) {
          /* todo bloco que precisa vir ANTES deste já tem que estar na fila, em posição anterior */
          ok = ordem.every(([antes, depois]) => {
            if (depois !== id) return true;
            const i = escolhidos.indexOf(antes);
            return i >= 0 && i < pos;
          });
        }
        if (ok) usados.push(id);
        resultado.push(ok);
        pos++;
      });
    });
    return resultado;
  }

  async function init() {
    try {
      gameData = await loadGameData('../data/quarto.json');
    } catch(e) {
      gameData = QUARTO_INLINE; // fallback file://
    }

    faseAtual = Math.min(gameState.getEstagio('quarto'), gameData.fases.length - 1);
    renderFase();
  }

  /* Texto falado: o rótulo do JSON já vem sem ícone (o desenho de cada passo é um SVG, ver imgTag) */
  function nomeFalado(rotulo) {
    return String(rotulo || '').replace(/\s+/g, ' ').trim();
  }
  function nomeDoBloco(id) { return nomeFalado(gameData.blocos[id] || id); }
  /* Textos de leitor de tela: vêm de "acessibilidade" no quarto.json */
  const A11Y = () => gameData?.acessibilidade || {};
  const txt = (chave, vars) => preencherTexto(A11Y()[chave], vars);
  const plural = (n, um, varios) => (n === 1 ? um : varios);
  function falar(texto, nivel) {
    if (window.Tutorial?.ativo) return;   /* no treino, quem fala é o Logi */
    anunciarAcessivel(texto, nivel);
  }

  function buildNivelTabs() {
    const cont = document.getElementById('niveis-tabs');
    cont.innerHTML = '';
    cont.setAttribute('role', 'list');
    gameData.fases.forEach((f, i) => {
      const span = document.createElement('span');
      if (i < faseAtual)        span.className = 'nivel nivel--ok';
      else if (i === faseAtual) span.className = 'nivel nivel--ativo';
      else                       span.className = 'nivel nivel--bloq';
      const situacao = i < faseAtual ? 'concluído' : i === faseAtual ? 'atual' : 'bloqueado';
      span.innerHTML = `${f.dificuldade}${i < faseAtual ? Icones.svg('check', 'nivel__ico') : ''}<span class="sr-only">, ${situacao}</span>`;
      span.setAttribute('role', 'listitem');
      if (i === faseAtual) span.setAttribute('aria-current', 'step');
      cont.appendChild(span);
    });
  }

  /* Instrução para leitor de tela: completa ao entrar (e no Alt+R), curta nas fases seguintes */
  let jaEntrou = false;
  function descreverQuarto(fase) {
    const vars = {
      entrada: jaEntrou ? '' : txt('entrada'), fase: fase.id, total: gameData.fases.length, nivel: fase.dificuldade,
      qtd: faseMontada.blocos.length, blocos: faseMontada.blocos.map(b => nomeFalado(b.rotulo)).join(', '),
      aviso: txt(fase.repetidos ? 'avisoRepetido' : 'avisoIntruso'), espacos: faseMontada.total
    };
    descreverComodo(preencherTexto(A11Y().completa, vars), { curta: jaEntrou ? preencherTexto(A11Y().curta, vars) : undefined });
    jaEntrou = true;
  }

  function renderFase() {
  const fase = gameData.fases[faseAtual];

  document.getElementById('logi-texto').innerHTML =
    gameData.instrucaoInstrutor.replace('IR À ESCOLA', '<span class="destaque-escola">IR À ESCOLA</span>');
  document.querySelector('.hud__subtitulo--roxo').textContent =
    `Fase ${fase.id} de ${gameData.fases.length}`;

  faseMontada = montarFase(fase);
  salvarIntrusos(faseMontada.intrusos);

  corrigida = [];
  verificado = false;
  erros = 0;
  pararAtencaoDica();

  buildNivelTabs();
  buildFonte();
  renderCorrigida();

  document.getElementById('feedback-area').style.display = 'none';
  document.getElementById('btn-verificar').disabled = false;

  atualizarBadge();
  descreverQuarto(fase);
  /* Tutorial do Logi: abre sozinho só na 1ª vez. Sem treino, o foco vai direto para o primeiro bloco. */
  if (!Tutorial.auto('quarto-f1')) focoInicial(quartoTutorial.primeiroFoco);
}

  /* ---- Blocos fonte (com erros marcados) ---- */
  function buildFonte() {
    const fase = gameData.fases[faseAtual];
    const cont = document.getElementById('blocos-fonte');
    cont.innerHTML = '';
    cont.dataset.muitos = String(faseMontada.blocos.length > 5);

    faseMontada.blocos.forEach((bloco, index) => {
  const id = bloco.id;
  const temErro = bloco.visivel || (bloco.erro && faseMontada.intrusosRevelados);

      const el = document.createElement('button');
      el.type = 'button';
      el.className = `bloco ${temErro ? 'bloco--erro' : 'bloco--roxo'}`;
      el.draggable = true;
      el.dataset.index = index;
      el.dataset.blocoId = id;
      /* O vermelho sozinho não é lido: o nome já diz que o bloco está errado e por quê */
      el.dataset.rotuloFalado = temErro
        ? txt(bloco.motivo === 'repetido' ? 'erroRepetido' : 'erroIntruso', { nome: nomeFalado(bloco.rotulo) })
        : txt('blocoNormal', { nome: nomeFalado(bloco.rotulo) });
      el.setAttribute('aria-label', el.dataset.rotuloFalado);

      const img = imgTag(id);
      
      el.innerHTML = `${img} ${bloco.rotulo}${temErro ? ' <span class="bloco__tag-erro" aria-hidden="true">!</span>' : ''}`;

      el.addEventListener('dragstart', e => {
        e.dataTransfer.setData('blocoId', id);
      });
      el.addEventListener('touchstart', touchStart, { passive: true });
      el.addEventListener('touchmove',  touchMove,  { passive: false });
      el.addEventListener('touchend',   touchEnd,   { passive: true });
      el.addEventListener('click', () => { adicionarBloco(id);});

      cont.appendChild(el);
    });
    manterOrdemDoTab(cont, '.bloco');
  }

  /* Desenho do passo: imagem (alt vazio) ou ícone SVG com aria-hidden. Nunca entra na leitura.
     No treino, "calcarep" é a calça repetida: usa o desenho da calça. */
  function imgTag(id) {
    const mapa = {
      mochila: '../img/item-mochila.png',
      brincar: '../img/item-brinquedo.png'
    };
    const src = mapa[id];
    if (src) return `<img src="${src}" alt="" class="bloco-img">`;
    const nome = Icones.tem('passo-' + id) ? 'passo-' + id : 'passo-' + String(id).replace(/rep$/, '');
    return Icones.tem(nome) ? `<span class="bloco-ico" aria-hidden="true">${Icones.svg(nome)}</span>` : '';
  }

  /* ---- Sequência corrigida (destino) ---- */
  function renderCorrigida() {
    const cont = document.getElementById('sequencia-corrigida');
    cont.innerHTML = '';
    const fase = gameData.fases[faseAtual];
    const total = faseMontada.total;

    corrigida.forEach((bid, idx) => {
      const bloco = { id: bid, rotulo: gameData.blocos[bid] || bid };
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'bloco bloco--roxo';
      el.dataset.idx = idx;
      el.dataset.blocoId = bid;
      el.setAttribute('aria-label', txt('posicao', { nome: nomeFalado(bloco.rotulo), pos: idx + 1, total }));
      el.innerHTML = `${imgTag(bid)} ${bloco.rotulo}<span class="bloco-remover" aria-hidden="true">${Icones.svg('x')}</span>`;
      el.addEventListener('click', () => removerBloco(idx));
      el.addEventListener('keydown', e => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          e.preventDefault();
          removerBloco(idx);
        }
      });
      cont.appendChild(el);
    });

    for (let i = corrigida.length; i < total; i++) {
      const empty = document.createElement('span');
      empty.className = 'bloco bloco--vazio';
      empty.textContent = i === corrigida.length ? 'bloco' : '';
      empty.setAttribute('aria-hidden', 'true');   /* as vagas vão no nome do grupo */
      cont.appendChild(empty);
    }
    cont.setAttribute('aria-label', resumoDaFila());
    manterOrdemDoTab(cont, 'button.bloco');

    marcarUsados();

    // drop na área
    cont.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; };
    cont.ondrop = e => {
      e.preventDefault();
      const bid = e.dataTransfer.getData('blocoId');
      if (bid) adicionarBloco(bid);
    };
  }

  /* "Fila: Vestir a camiseta, Vestir a calça. 2 de 4 blocos." (Alt+S e nome do grupo) */
  function resumoDaFila() {
    return corrigida.length
      ? txt('resumo', { lista: corrigida.map(nomeDoBloco).join(', '), n: corrigida.length, total: faseMontada.total })
      : txt('resumoVazio', { total: faseMontada.total });
  }
  window.resumoDaPagina = () => (window.Tutorial?.ativo || !gameData ? '' : resumoDaFila());

  function adicionarBloco(bid, origem) {
    /* Com o tutorial aberto, a ação da criança passa pelo Logi (acerta ou encoraja) */
    if (window.Tutorial?.ativo && origem !== 'tutorial') {
      Tutorial.tentar('adicionar', bid, () => adicionarBloco(bid, 'tutorial'));
      return;
    }
    if (verificado) return;
    /* Cada bloco da origem só pode ser usado uma vez (na fase 1, o bloco repetido tem 2 cópias selecionáveis) */
    const copias = faseMontada.blocos.filter(b => b.id === bid).length;
    if (corrigida.filter(x => x === bid).length >= copias) { balancarBloco(bid); return; }
    if (corrigida.length >= faseMontada.total) { falar(txt('filaCheia')); return; }
    corrigida.push(bid);
    const faltam = faseMontada.total - corrigida.length;
    /* Por voz, só o bloco que entrou (e o aviso de fila completa). O resto fica no Alt+S. */
    falar(txt('adicionado', { nome: nomeDoBloco(bid), pos: corrigida.length, falta: faltam ? '' : txt('completa2') }).trim());
    audio.clique();
    pararAtencaoDica();
    renderCorrigida();
    document.getElementById('feedback-area').style.display = 'none';
  }

  /* Efeito sutil nos blocos (origem e destino) quando a ação já foi usada */
  function balancarBloco(bid) {
    document.querySelectorAll(`#blocos-fonte .bloco[data-bloco-id="${bid}"], #sequencia-corrigida .bloco[data-bloco-id="${bid}"]`).forEach(el => {
      el.classList.remove('bloco--aviso');
      void el.offsetWidth;
      el.classList.add('bloco--aviso');
    });
  }

  function marcarUsados() {
    const vistos = {};
    document.querySelectorAll('#blocos-fonte .bloco').forEach(el => {
      const id = el.dataset.blocoId;
      const usados = corrigida.filter(x => x === id).length;
      vistos[id] = (vistos[id] || 0) + 1;
        const usado = vistos[id] <= usados;
      el.classList.toggle('bloco--usado', usado);
      if (el.dataset.rotuloFalado) {
        el.setAttribute('aria-label', usado && !el.classList.contains('bloco--erro') ? txt('blocoUsado', { texto: el.dataset.rotuloFalado }) : el.dataset.rotuloFalado);
      }
    });
  }

  function removerBloco(idx) {
    if (verificado || window.Tutorial?.ativo) return;
    const [removido] = corrigida.splice(idx, 1);
    renderCorrigida();
    document.getElementById('feedback-area').style.display = 'none';
    /* Por voz, só o bloco que saiu (e o aviso de fila vazia) */
    falar(txt('removido', { nome: nomeDoBloco(removido), sobra: corrigida.length ? '' : txt('filaVazia') }).trim());
    /* O bloco em foco sumiu: o foco vai para o vizinho (ou para a lista de passos) */
    (document.querySelector(`#sequencia-corrigida .bloco[data-idx="${Math.min(idx, corrigida.length - 1)}"]`)
      || document.querySelector('#blocos-fonte .bloco'))?.focus();
  }

  /* ---- Touch drag ---- */
  function touchStart(e) {
    touchBloco = e.currentTarget.dataset.blocoId;
    const touch = e.touches[0];
    touchGhost = e.currentTarget.cloneNode(true);
    touchGhost.style.cssText = `position:fixed;opacity:0.75;pointer-events:none;z-index:9999;left:${touch.clientX-30}px;top:${touch.clientY-20}px;`;
    document.body.appendChild(touchGhost);
  }
  function touchMove(e) {
    e.preventDefault();
    if (!touchGhost) return;
    const touch = e.touches[0];
    touchGhost.style.left = (touch.clientX - 30) + 'px';
    touchGhost.style.top  = (touch.clientY - 20) + 'px';
  }
  function touchEnd(e) {
    if (touchGhost) { touchGhost.remove(); touchGhost = null; }
    if (!touchBloco) return;
    const touch = e.changedTouches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const dest = document.getElementById('sequencia-corrigida');
    if (dest && (dest === el || dest.contains(el))) adicionarBloco(touchBloco);
    touchBloco = null;
  }

  /* ---- Verificação ---- */
  function verificar() {
    /* Tutorial aberto: só vale como o passo "conferir"; marca a fila de treino como certa */
    if (window.Tutorial?.ativo) {
      Tutorial.tentar('verificar', null, () => quartoTutorial.acoes.verificar());
      return;
    }
    const fase = gameData.fases[faseAtual];
    if (corrigida.length < faseMontada.total) {
      audio.erro();
      mostrarFeedbackTexto(corrigida.length === 0
        ? 'Ops! Escolha os blocos antes de verificar.'
        : 'Ops! Preencha todos os espaços antes de verificar.');
      const painel = document.getElementById('painel-destino');
      painel.classList.remove('shake');
      void painel.offsetWidth;
      painel.classList.add('shake');
      return;
    }
    verificado = true;

    const posicoes = validarPosicoes(faseMontada.passos, corrigida, faseMontada.ordem);
    const total = faseMontada.total;
    let acertos = 0;

    /* Marca certo/errado direto nos blocos montados */
    const blocosEl = document.querySelectorAll('#sequencia-corrigida .bloco[data-idx]');
    corrigida.forEach((bid, i) => {
      const ok = posicoes[i];
      if (ok) acertos++;
      const bloco = { rotulo: gameData.blocos[bid] || bid };
      const el = blocosEl[i];
      el.classList.remove('bloco--roxo');
      el.classList.add(ok ? 'bloco--verde' : 'bloco--erro');
      el.querySelector('.bloco-remover')?.remove();
      el.insertAdjacentHTML('beforeend', `<strong class="bloco-resultado" aria-hidden="true">${Icones.svg(ok ? 'check' : 'x')}</strong>`);
      el.setAttribute('aria-label', txt(ok ? 'posicaoCerta' : 'posicaoErrada', { nome: nomeFalado(bloco.rotulo), pos: i + 1, total }));
    });

    if (acertos === total) {
      audio.acerto();
      mostrarFeedbackTexto('Muito bem! A rotina está na ordem certa!', 'ok');
      setTimeout(() => conclusao(), 600);
    } else {
      erros++;
      ativarAtencaoDica();
      audio.erro();
      verificado = false;
      const lista = corrigida.map((bid, i) => posicoes[i] ? null : txt('resultadoItem', { pos: i + 1, nome: nomeDoBloco(bid) })).filter(Boolean).join('; ');
      /* Mesmo texto na tela e por voz: diz quais blocos estão com erro, sem depender da cor */
      mostrarFeedbackTexto(txt('resultado', { acertos, total, lista }));
    }
  }

  function mostrarFeedbackTexto(msg, tipo = 'erro') {
    const area = document.getElementById('feedback-area');
    const txt  = document.getElementById('feedback-texto');
    area.className = `dica quarto-feedback dica--${tipo === 'ok' ? 'verde' : 'erro'}`;
    txt.className  = `dica__texto dica__texto--${tipo === 'ok' ? 'verde' : 'erro'}`;
    txt.textContent = msg;
    area.style.display = 'flex';
    anunciarAcessivel(msg, tipo === 'ok' ? 'polite' : 'assertive');
  }

 function conclusao() {
  const fase = gameData.fases[faseAtual];
  pararAtencaoDica();

  const scoreFase = gameState.calcularScore(erros);

  let scoresQuarto = JSON.parse(localStorage.getItem('quarto_scores_fases') || '{}');
  scoresQuarto[fase.id] = scoreFase;
  localStorage.setItem('quarto_scores_fases', JSON.stringify(scoresQuarto));

  const errosQuarto = gameState.getErrorsFromPhaseScores(scoresQuarto);
  const totalQuarto = gameState.calcularScore(errosQuarto);

  const proxFase = faseAtual + 1;
  const quartoConcluido = proxFase >= gameData.fases.length;
  gameState.setRoomScore('quarto', totalQuarto, quartoConcluido);
  atualizarBadge(totalQuarto);

  if (proxFase < gameData.fases.length) {
    gameState.setEstagio('quarto', proxFase);
  } else {
    gameState.limparEstagio('quarto');
  }

  document.getElementById('modal-sub').textContent =
    `Você corrigiu a sequência da ${fase.titulo}!`;

  document.getElementById('modal-pts').textContent =
    `Pontuação da fase: ${scoreFase} / 25 pts`;

  const elEst = document.getElementById('modal-estrelas');
  elEst.innerHTML = '';

  const estrelas = gameState.getStars(scoreFase);
  elEst.setAttribute('aria-label', `${estrelas} de 3 estrelas conquistadas`);

  for (let i = 0; i < 3; i++) {
    const img = document.createElement('img');
    img.src = '../img/estrela.png';
    img.alt = '';
    img.className = i < estrelas ? 'modal-estrela-img' : 'modal-estrela-img modal-estrela-img--vazia';
    elEst.appendChild(img);
  }

  const btnGrupo = document.querySelector('#modal-conclusao .btn-grupo');

  btnGrupo.innerHTML = '';

  if (proxFase < gameData.fases.length) {
    const btnProx = document.createElement('button');
    btnProx.className = 'btn btn--roxo';
    btnProx.textContent = 'Próxima fase';
    btnProx.onclick = () => {
      faseAtual = proxFase;
      fecharModalFluxoAcessivel(document.getElementById('modal-conclusao'));
      renderFase();
    };
    btnGrupo.appendChild(btnProx);
  }

  const btnMapa = document.createElement('button');
  btnMapa.className = 'btn btn--outline-roxo';
  btnMapa.textContent = 'Voltar ao mapa';
  btnMapa.onclick = () => {
    gameState.sairMiniGame('quarto', 'MapaCasa.html');
  };
  btnGrupo.appendChild(btnMapa);

  abrirModalFluxoAcessivel(document.getElementById('modal-conclusao'));
  window.removeEventListener('beforeunload', beforeUnloadHandler);
}

  function atualizarBadge(score) {
    const s = score !== undefined ? score : (gameState.get().scores.quarto || 0);
    document.getElementById('badge-pts').textContent = s + ' pts';
  }

  function beforeUnloadHandler() {
    const s = gameState.get().scores.quarto;
    if (s !== null) sendFinalScore({ score: gameState.getTotalScore(), difficulty: getPlatformDifficulty() });
  }
  window.addEventListener('beforeunload', beforeUnloadHandler);

  /* ---- Ajuda (Como jogar / Objetivo) ---- */
  function abrirModalAjuda() {
    const modal = document.getElementById('modal-ajuda');
    try { ComoJogar.irParaFase('quarto', faseAtual); } catch (e) {}
    abrirTutorialAcessivel(modal, document.getElementById('btn-ajuda'));
  }
  function fecharModalAjuda() {
    fecharTutorialAcessivel(document.getElementById('modal-ajuda'));
  }

  document.getElementById('btn-ajuda').addEventListener('click', abrirModalAjuda);
  document.getElementById('modal-ajuda-fechar').addEventListener('click', fecharModalAjuda);
  document.getElementById('modal-ajuda').addEventListener('click', e => {
    if (e.target.id === 'modal-ajuda') fecharModalAjuda();
  });

  /* ---- Esc: fecha a janela aberta; sem janela, pergunta antes de sair do cômodo (plataforma.js) ---- */
  ativarSaidaComEsc('quarto');

  /* ---- Dica do Logi (não conta erro nem ponto) ----
     1) mostra em vermelho o bloco que não combina (repetido ou intruso) e aponta para ele;
     2) se já há bloco no lugar errado na fila, aponta qual é;
     3) senão, destaca os blocos de onde pode vir o próximo passo. */
  function passosDaDica() {
    const fase = gameData.fases[faseAtual];
    const geral = gameData.dicaGeral || {};
    const marcas = txt => txt.match(/(?<!\p{L})\p{Lu}{3,}(?!\p{L})/gu) || [];
    const passo = (destaque, fala, evitar, audiodescricao) => ({ destaque, fala, palavraChave: marcas(fala), evitar, audiodescricao });
    const fonte = '#blocos-fonte', fila = '#sequencia-corrigida';

    if (faseMontada.temErro && !faseMontada.intrusosRevelados && fase.dica?.suspeito) {
      revelarIntrusos();
      const vermelhos = [...document.querySelectorAll(`${fonte} .bloco--erro`)];
      const lista = vermelhos.map(el => el.dataset.rotuloFalado).join('; ');
      return [passo(vermelhos, fase.dica.suspeito, fila,
        txt('dicaComErro', { quais: txt(vermelhos.length === 1 ? 'dicaUmErro' : 'dicaVariosErros', { lista }) }))];
    }

    const posicoes = validarPosicoes(faseMontada.passos, corrigida, faseMontada.ordem);
    const errado = corrigida.findIndex((_, i) => !posicoes[i]);
    if (errado >= 0) {
      return [passo(document.querySelector(`${fila} .bloco[data-idx="${errado}"]`), geral.lugar, fonte,
        txt('dicaLugar', { pos: errado + 1, nome: nomeDoBloco(corrigida[errado]) }))];
    }

    if (corrigida.length >= faseMontada.total) {
      return [passo('#btn-verificar', 'Tudo certo! Toque em VERIFICAR.', fonte, txt('dicaPronto'))];
    }

    /* Grupo em que a próxima posição cai; os blocos que ainda faltam nele */
    let inicio = 0, grupo = [];
    for (const g of faseMontada.passos) {
      if (corrigida.length < inicio + g.length) { grupo = g.filter(id => !corrigida.slice(inicio).includes(id)); break; }
      inicio += g.length;
    }
    const candidatos = [...document.querySelectorAll(`${fonte} .bloco:not(.bloco--usado):not(.bloco--erro)`)]
      .filter(el => grupo.includes(el.dataset.blocoId));
    return [passo(candidatos, geral.proximo, fila,
      txt('dicaProximo', { lista: candidatos.map(el => nomeFalado(el.textContent)).join('; ') }))];
  }

  document.getElementById('btn-dica').addEventListener('click', () => {
    if (!gameData || !faseMontada || window.Tutorial?.ativo) return;
    const passos = passosDaDica();
    audio.clique();
    pararAtencaoDica();
    Tutorial.dica({ comodo: 'quarto', passos });
  });

  /* ---- Item 8 — chama atenção para a Dica após o primeiro erro ---- */
  /* Intrusos só ficam vermelhos quando a criança pede a dica */
  function revelarIntrusos() {
    if (window.Tutorial?.ativo) return;
    if (!faseMontada || faseMontada.intrusosRevelados || !faseMontada.temErro) return;
    faseMontada.intrusosRevelados = true;
    buildFonte();
    marcarUsados();
  }

  function ativarAtencaoDica() { document.getElementById('btn-dica').classList.add('btn-dica--pulsar'); }
  function pararAtencaoDica() { document.getElementById('btn-dica').classList.remove('btn-dica--pulsar'); }

  document.getElementById('btn-verificar').addEventListener('click', () => { if (gameData) verificar(); });
  document.getElementById('btn-limpar').addEventListener('click', () => {
    if (!gameData || window.Tutorial?.ativo) return;
    corrigida = [];
    verificado = false;
    renderCorrigida();
    document.getElementById('feedback-area').style.display = 'none';
    anunciarAcessivel(txt('limpa') || 'Fila limpa.');
  });

  /* ---- Tutorial do Logi: treino com blocos reais ---- */
  let salvoTutorial = null;

  const quartoTutorial = {
    comodo: 'quarto',
    tutorialDaFase: () => 'quarto-f1',
    primeiroFoco: () => document.querySelector('#blocos-fonte .bloco'),

    preparar(def) {
      const t = def.treino;
      salvoTutorial = { corrigida: [...corrigida], faseMontada, verificado };
      const blocos = t.blocos.map(b => {
        const o = typeof b === 'string' ? { id: b } : b;
        const base = o.base || o.id;
        return { id: o.id, rotulo: gameData.blocos[base] || base, erro: Boolean(o.erro), visivel: Boolean(o.erro), motivo: o.base ? 'repetido' : 'intruso' };
      });
      faseMontada = { blocos, passos: t.passos, total: t.total, intrusos: [], temErro: true, intrusosRevelados: true };
      corrigida = [];
      verificado = false;
      document.getElementById('feedback-area').style.display = 'none';
      buildFonte();
      renderCorrigida();
    },

    restaurar() {
      if (salvoTutorial) {
        faseMontada = salvoTutorial.faseMontada;
        corrigida = salvoTutorial.corrigida;
        verificado = salvoTutorial.verificado;
        salvoTutorial = null;
      }
      buildFonte();
      renderCorrigida();
    },

    acoes: {
      adicionar: id => adicionarBloco(id, 'tutorial'),
      /* Treino: mostra a fila montada como certa (marca verde), sem contar erro nem ponto */
      verificar() {
        document.querySelectorAll('#sequencia-corrigida .bloco[data-idx]').forEach(el => {
          el.classList.remove('bloco--roxo');
          el.classList.add('bloco--verde');
          el.querySelector('.bloco-remover')?.remove();
          el.insertAdjacentHTML('beforeend', `<strong class="bloco-resultado" aria-hidden="true">${Icones.svg('check')}</strong>`);
        });
      }
    }
  };

  Tutorial.configurar(quartoTutorial);
  init();
  </script>
